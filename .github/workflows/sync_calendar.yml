name: Sync Work Calendar

on:
  schedule:
    # Denna rad (Cron-format) kör scriptet varje dag kl. 06:00 och 18:00 UTC
    - cron: '0 6,18 * * *'
  # Manuell "Kör nu"-knapp inne på GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    # Hämta kod från repot
# Hämta kod från repot (Tvinga den att ta senaste main!)
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main

    # Starta Python på den virtuella datorn
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Installera bibliotek från requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    # Skapa credentials.json temporärt från dina GitHub Secrets
    - name: Create credentials.json
      run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

    # Skapa token.json temporärt från dina GitHub Secrets
    - name: Create token.json
      run: echo '${{ secrets.GOOGLE_TOKEN }}' > token.json


      
    - name: Run Python script
      env:
        # Här mappar vi dina GitHub Secrets till namnen Python letar efter
        LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
        LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        # E-postnotiser vid schemaändringar (tidsbyte/borttaget pass)
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      run: python main.py
